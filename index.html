
<!doctype html><html lang="zh-Hant"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TPASS Tracker v3</title>
 <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1976d2">
<style>
body{font-family:system-ui;max-width:760px;margin:auto;padding:16px;background:#f5f5f5}
.card{background:#fff;padding:12px;border-radius:10px;margin:10px 0}
button{padding:10px 12px;margin:4px;border:0;border-radius:8px;background:#1976d2;color:#fff}
.sel{background:#2e7d32}.gray{background:#666}.danger{background:#c62828}
.item{border-bottom:1px solid #ddd;padding:8px 0}
small{color:#666}
</style>
<body>
<h2>TPASS Tracker</h2>

<div class="card">
<div id="status"></div>
<button class="gray" onclick="setPass()">⚙ TPASS</button>
<button class="gray" onclick="setCats()">⚙ 類別</button>
</div>

<div class="card">
<div id="cats"></div>
</div>

<div class="card">
<button onclick="add('公車',15)">🚌15</button>
<button onclick="add('公車',30)">🚌30</button><br>
<script>
[20,25,30,35,40,45,50,55,60,65].forEach(f=>{
document.write(`<button onclick="add('捷運',${f})">🚇${f}</button>`);
});
</script>
<button class="gray" onclick="customFare()">🚇✏</button>
</div>

<div class="card">
<button class="gray" onclick="undo()">Undo</button>
<button class="danger" onclick="clearAll()">清空</button>
</div>

<div class="card"><h3>歷史</h3><div id="log"></div></div>

<script>
let events=JSON.parse(localStorage.events||"[]");
let pass=Number(localStorage.pass||1200);
let cats=JSON.parse(localStorage.categories||'["必要","2","3","4"]');
let current=Number(localStorage.currentCategory||0);

function persist(){
 localStorage.events=JSON.stringify(events);
 localStorage.pass=pass;
 localStorage.categories=JSON.stringify(cats);
 localStorage.currentCategory=current;
 render();
}

function renderCats(){
 let d=document.getElementById("cats"); d.innerHTML="";
 cats.forEach((c,i)=>{
   let b=document.createElement("button");
   b.textContent=c;
   if(i===current)b.className="sel";
   b.onclick=()=>{current=i;persist();};
   d.appendChild(b);
 });
}

function add(type,fare){
 events.push({
   id:crypto.randomUUID(),
   time:Date.now(),
   type,fare,
   category:current,
   note:""
 });
 persist();
}
function customFare(){
 let v=prompt("捷運票價");
 if(v!==null&&v!==""){v=Number(v); if(!isNaN(v)) add("捷運",v);}
}
function undo(){if(events.length){events.pop();persist();}}
function clearAll(){if(confirm("清空全部？")){events=[];persist();}}
function del(id){events=events.filter(e=>e.id!==id);persist();}
function edit(id){
 let e=events.find(x=>x.id===id);
 let n=prompt("備註",e.note);
 if(n!==null){e.note=n;persist();}
}
function setPass(){
 let v=prompt("TPASS 金額",pass);
 if(v!==null&&v!==""){pass=Number(v)||pass;persist();}
}
function setCats(){
 let txt=prompt("JSON Array",JSON.stringify(cats));
 if(txt===null)return;
 try{
   let arr=JSON.parse(txt);
   if(Array.isArray(arr)&&arr.length===4){cats=arr;persist();}
   else alert("請輸入長度4的 JSON Array");
 }catch(e){alert("JSON 格式錯誤");}
}
function render(){
 renderCats();
 let total=0;
 let now=new Date();
 let y=now.getFullYear(),m=now.getMonth();
 let log=document.getElementById("log"); log.innerHTML="";
 [...events].reverse().forEach(e=>{
   let d=new Date(e.time);
   if(d.getFullYear()==y&&d.getMonth()==m) total+=e.fare;
   let div=document.createElement("div");
   div.className="item";
   div.innerHTML=`${d.toLocaleString()}<br>${cats[e.category]}｜${e.type} $${e.fare}${e.note?`<br><small>${e.note}</small>`:""}
   <br><button class="gray" onclick="edit('${e.id}')">✏</button>
   <button class="danger" onclick="del('${e.id}')">🗑</button>`;
   log.appendChild(div);
 });
 let remain=pass-total;
 document.getElementById("status").innerHTML=
 remain>=0?`<b>還差 $${remain} 回本</b><br><small>累積 $${total} / ${pass}</small>`:
 `<b>已回本 $${-remain}</b><br><small>累積 $${total} / ${pass}</small>`;
}
persist();
</script>
</body></html>
